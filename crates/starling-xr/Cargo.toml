[package]
name = "starling-xr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Starling VR: the OpenXR and Vulkan calls that put the game in a Meta Quest, which the crates that forbid unsafe code can't make"
publish = false

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan"] }
glam = "0.30"
log = "0.4"

[target.'cfg(not(target_os = "macos"))'.dependencies]
openxr = { version = "0.22.0", features = ["loaded"] }
# The version wgpu-hal already uses.
ash = { version = "0.38", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1.1"

[lints]
workspace = true
